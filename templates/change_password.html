{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="ds-card p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-1">Ganti Password</h2>
        <p class="text-xs text-gray-500 mb-5">Perbarui password akun administrator ({{ current_user.username }}).</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4 p-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-xs">
                    {% for m in messages %}<div>{{ m }}</div>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Password Saat Ini</label>
                <input type="password" name="current_password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Password Baru (min. 8 karakter)</label>
                <input type="password" name="new_password" required minlength="8" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Konfirmasi Password Baru</label>
                <input type="password" name="confirm_password" required minlength="8" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg">
                    Simpan Password
                </button>
                <a href="{{ url_for('main.dashboard') }}" class="text-xs text-gray-600 hover:text-gray-900">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
