{% extends 'base.html' %}
{% block auth %}
<div class="min-h-screen bg-[#f2f4f6] flex items-center justify-center px-4 relative">
    <div class="relative w-full max-w-sm">
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <!-- Brand band -->
            <div class="px-8 pt-8 pb-6 border-b border-gray-200 flex flex-col items-center text-center relative">
                <img src="{{ url_for('static', filename='images/logo_wpsecops.png') }}" alt="WP-SecOps" class="h-20 w-auto mb-4 max-w-full">
                <p class="text-xs text-gray-500 mt-2.5">Centralized WordPress Security Scanner</p>
            </div>

            <div class="p-8">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for msg in messages %}
                        <div class="mb-5 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm" role="alert">
                            {{ msg }}
                        </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" class="space-y-5">
                    <div>
                        <label for="username" class="block text-xs font-semibold text-gray-700 mb-1.5">Username</label>
                        <div class="relative">
                            <svg aria-hidden="true" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin"
                                class="w-full bg-white border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition">
                        </div>
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">Password</label>
                        <div class="relative">
                            <svg aria-hidden="true" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••"
                                class="w-full bg-white border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition">
                        </div>
                    </div>
                    <button type="submit"
                        class="w-full bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-semibold py-2.5 rounded-lg transition text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 inline-flex items-center justify-center gap-2">
                        Masuk
                        <svg aria-hidden="true" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-[11px] text-gray-400 mt-6 font-mono tracking-wide">WhatWeb &middot; WPScan &middot; Nuclei &middot; Hardening</p>
    </div>
</div>
{% endblock %}
