services:
  # ==========================================
  # GRUP A: LEGACY & HIGH-RISK (Target 1 - 3)
  # ==========================================
  # Target 1: WordPress 4.6 (Port 8081)
  db1:
    image: mysql:5.7
    restart: always
    volumes:
      - ./wp1_db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: wp1
      MYSQL_ROOT_PASSWORD: password1
  wp1:
    image: wordpress:4.6
    restart: always
    volumes:
      - ./wp1_data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db1
      WORDPRESS_DB_NAME: wp1
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password1

